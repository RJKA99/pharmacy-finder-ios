name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PharmacyKit
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  build-app:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild build \
            -project PharmacyFinder.xcodeproj \
            -scheme PharmacyFinder \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
